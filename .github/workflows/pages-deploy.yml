name: Deploy site to GitHub Pages

# Uploads the repo root as-is -- no build step, this is a static hello-world site
# (index.html at the root, no bundler/npm involved). Modelled on ai-app-factory's own
# pages-deploy.yml, minus the build job it has no equivalent need for.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
